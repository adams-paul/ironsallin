<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Irons All In</title>
  
  <!-- Universal font loaded across all devices -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Global Page Styles */
    body {
      background-color: #FFFDFB;
      font-family: 'Inter', sans-serif;
      margin: 20px;
    }

    /* Wrap long URLs on mobile so they don't stretch the screen */
    p, a {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* Link Colors */
    a {
      color: #083460;
    }

    a:visited {
      color: #a5cadbff;
    }

    /* Item titles */
    h2 {
      color: #6e1c1c;
      font-weight: 500; /* Medium */
    }

    /* Sources heading */
    h3 {
      color: #6e1c1c;
      font-weight: 500; /* Medium */
      font-size: 1.1em;
      margin-top: 1.2em;
      margin-bottom: 0.4em;
    }

    /* Brackets around the RSS question mark */
    .rss-help {
      color: #a5cadbff;
    }

    /* Post images: 100% width on mobile */
    .item-image img {
      width: 100%;
      height: auto;
      display: block;
      margin: 12px 0;
    }

    /* Desktop layout: 2 columns (Title across top, Left: Date/Content, Right: Image) */
    @media (min-width: 768px) {
      article.has-image {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        column-gap: 28px;
        align-items: start;
      }

      article.has-image .item-title {
        grid-column: 1 / -1; /* Spans across both columns */
      }

      article.has-image .item-date {
        grid-column: 1;
        grid-row: 2;
        margin: 0 0 10px 0;
      }

      article.has-image .item-content {
        grid-column: 1;
        grid-row: 3;
      }

      article.has-image .item-image {
        grid-column: 2;
        grid-row: 2 / span 2; /* Sits on the right column */
        margin: 0;
      }

      article.has-image .item-image img {
        margin: 0;
      }

      /* Ensure the dividing line spans across both columns below the photo */
      article.has-image hr {
        grid-column: 1 / -1;
        width: 100%;
        margin: 24px 0 0 0;
      }
    }

    /* Logo sizing: half the size of post images (17.5%) */
    .site-logo {
      width: 17.5%;
      margin: 12px 0 16px 0;
    }

    /* Line Dividers */
    hr {
      border: none;
      border-top: 1px solid #a5cadbff;
      margin: 24px 0;
    }
  </style>
</head>
<body>
<div style="text-align:right; padding:4px 8px;">
  <a href="/articles" style="margin-right: 12px;">Articles</a>
  <a href="https://linktr.ee/ironsallin" target="_blank" rel="noopener noreferrer" style="margin-right: 12px;">Links</a>
  <a href="https://feedserve.adams-paul.workers.dev/ironsallin" target="_blank" rel="noopener noreferrer">RSS</a>
  <span class="rss-help">(<a href="https://pauladams.neocities.org/articles/wtf-is-an-rss-feed" target="_blank" rel="noopener noreferrer">?</a>)</span>
</div>

  <header>
    <img
      src="iai-logo.png"
      onerror="if(!this.dataset.tried){this.dataset.tried=1;this.src='https://raw.githubusercontent.com/adams-paul/ironsallin/main/iai-logo.png';}else if(this.dataset.tried==1){this.dataset.tried=2;this.src='https://raw.githubusercontent.com/adams-paul/ironsallin/master/iai-logo.png';}" 
      alt="Irons All In Logo" 
      class="site-logo">
  </header>

  <hr>

  <main id="feed-container">
    <p id="status">Loading...</p>
  </main>

  <script>
    const PRIMARY_URL = 'https://feedserve.adams-paul.workers.dev/ironsallin?format=json';
    const FALLBACK_URL = 'https://feedgate.adams-paul.workers.dev/ironsallin';

    function cleanTitle(str) {
      return String(str || 'No Title')
        .replace(/[\p{Extended_Pictographic}\u200d\ufe0f]/gu, '')
        .replace(/\s{2,}/g, ' ')
        .trim();
    }

    function escHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function linkify(str) {
      return escHtml(str).replace(
        /(https?:\/\/[^\s<]+)/g,
        '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
      );
    }

    // Formats body text, puts 'Sources' in h3, and renders source names as clickable links
    function formatContent(rawHtml) {
      if (!rawHtml) return '';

      // Clean tags while preserving text
      let text = String(rawHtml)
        .replace(/<head[^>]*>[\s\S]*?<\/head>/gi, ' ')
        .replace(/<(script|style|title)[^>]*>[\s\S]*?<\/\1>/gi, ' ')
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<\/p>/gi, '\n\n')
        .replace(/<[^>]*>/g, ' ');

      // Normalize spaces
      text = text.replace(/[ \t]+/g, ' ').trim();

      // Only match "Sources" when directly followed by links (ignores mid-sentence words like "according to sources.")
      const sourcesMatch = text.match(/\bSources\b\s*:?\s*(?=(?:[^.!?\n\r]+:\s*)?https?:\/\/)/i);

      let bodyText = text;
      let sourcesSection = '';

      if (sourcesMatch) {
        bodyText = text.substring(0, sourcesMatch.index).trim();
        sourcesSection = text.substring(sourcesMatch.index + sourcesMatch[0].length).trim();
      }

      let html = `<p>${linkify(bodyText)}</p>`;

      if (sourcesSection) {
        html += `<h3>Sources</h3>`;

        // Regex captures: Group 1 = Source Name, Group 2 = URL
        const sourceRegex = /((?:(?!https?:\/\/)[^])*?)\s*(https?:\/\/[^\s<]+)/gi;
        const sourceItems = [];
        let match;

        while ((match = sourceRegex.exec(sourcesSection)) !== null) {
          // Strip any trailing colons or excess whitespace from the source name
          let name = match[1].replace(/[:\s]+$/, '').trim();
          const url = match[2].trim();
          if (!url) continue;

          if (name) {
            // Renders the clean source name (e.g. "The West Ham Way") as the clickable link
            sourceItems.push(`<p><a href="${escHtml(url)}" target="_blank" rel="noopener noreferrer">${escHtml(name)}</a></p>`);
          } else {
            sourceItems.push(`<p><a href="${escHtml(url)}" target="_blank" rel="noopener noreferrer">${escHtml(url)}</a></p>`);
          }
        }

        if (sourceItems.length > 0) {
          html += sourceItems.join('');
        } else {
          html += `<p>${linkify(sourcesSection).replace(/\n+/g, '<br>')}</p>`;
        }
      }

      return html;
    }

    function extractImage(item, rawHtml) {
      if (item && (item.imageUrl || item.image || item.thumbnail)) {
        return item.imageUrl || item.image || item.thumbnail;
      }
      if (rawHtml) {
        const match = rawHtml.match(/<img[^>]+src=["']([^"']+)["']/i);
        if (match && match[1]) return match[1];
      }
      return '';
    }

    function formatDate(str) {
      if (!str) return '';
      const d = new Date(str);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('en-GB', { 
        day: 'numeric', 
        month: 'long', 
        year: 'numeric' 
      });
    }

    async function fetchFeedData() {
      // 1. Try FeedServe JSON
      try {
        const res = await fetch(PRIMARY_URL);
        if (res.ok) {
          const text = await res.text();
          if (text.trim().startsWith('{') || text.trim().startsWith('[')) {
            const data = JSON.parse(text);
            const items = Array.isArray(data) ? data : (data.items || []);
            if (items.length > 0) return { type: 'json', items };
          }
        }
      } catch (e) {
        console.warn('Primary fetch failed, using fallback feed...', e);
      }

      // 2. Fallback to FeedGate
      const fallbackRes = await fetch(FALLBACK_URL);
      if (!fallbackRes.ok) throw new Error('HTTP ' + fallbackRes.status + ' from fallback feed');
      const text = await fallbackRes.text();
      return { type: 'xml', text };
    }

    async function loadFeed() {
      const container = document.getElementById('feed-container');

      try {
        const feedData = await fetchFeedData();
        let items = [];

        if (feedData.type === 'json') {
          items = feedData.items.map(it => {
            const rawHtml = it.content_html || it.content || it.summary || it.description || '';
            return {
              title: cleanTitle(it.title),
              date: formatDate(it.date_published || it.pubDate),
              image: extractImage(it, rawHtml),
              rawContent: rawHtml
            };
          });
        } else {
          const parser = new DOMParser();
          const xml = parser.parseFromString(feedData.text, 'text/xml');
          const entries = xml.querySelectorAll('item, entry');

          entries.forEach(entry => {
            const rawTitle = entry.querySelector('title')?.textContent || '';
            const rawDate = entry.querySelector('pubDate, published, updated, date')?.textContent || '';
            
            const rawContent = 
              entry.getElementsByTagName('content:encoded')[0]?.textContent ||
              entry.querySelector('content')?.textContent ||
              entry.querySelector('description')?.textContent || '';

            const mediaTag = entry.querySelector('media\\:content, content, enclosure[type*="image"]');
            const mediaThumb = entry.querySelector('media\\:thumbnail');
            let imgUrl = mediaTag?.getAttribute('url') || mediaThumb?.getAttribute('url') || '';
            
            if (!imgUrl) {
              imgUrl = extractImage(null, rawContent);
            }

            items.push({
              title: cleanTitle(rawTitle),
              date: formatDate(rawDate),
              image: imgUrl,
              rawContent: rawContent
            });
          });
        }

        if (items.length === 0) {
          container.innerHTML = '<p>No items found.</p>';
          return;
        }

        container.innerHTML = '';

        items.forEach(item => {
          const article = document.createElement('article');
          if (item.image) article.classList.add('has-image');

          // Title
          const heading = document.createElement('h2');
          heading.className = 'item-title';
          heading.textContent = item.title;
          article.appendChild(heading);

          // Date
          if (item.date) {
            const dateP = document.createElement('p');
            dateP.className = 'item-date';
            dateP.textContent = item.date;
            article.appendChild(dateP);
          }

          // Image
          if (item.image) {
            const imgDiv = document.createElement('div');
            imgDiv.className = 'item-image';
            const img = document.createElement('img');
            img.src = item.image;
            img.alt = item.title;
            imgDiv.appendChild(img);
            article.appendChild(imgDiv);
          }

          // Content with 'Sources' in <h3> and clickable source names
          if (item.rawContent) {
            const contentDiv = document.createElement('div');
            contentDiv.className = 'item-content';
            contentDiv.innerHTML = formatContent(item.rawContent);
            article.appendChild(contentDiv);
          }

          container.appendChild(article);
          container.appendChild(document.createElement('hr'));
        });

      } catch (err) {
        container.innerHTML = '<p>Failed to load feed: ' + err.message + '</p>';
      }
    }

    loadFeed();
  </script>

</body>
</html>
