<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Irons All In</title>
  <style>
    body {
      background: white;
      color: black;
      font-family: Verdana, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 { font-size: 1.2em; margin-bottom: 4px; }

    .page-desc {
      font-size: 0.9em;
      color: #555;
      margin: 0 0 8px 0;
    }

    .page-links {
      font-size: 0.85em;
      margin: 0 0 24px 0;
    }

    .page-links a {
      color: black;
      margin-right: 12px;
    }

    .item-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .item-row {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .item-row:first-child {
      border-top: 1px solid #eee;
    }

    .item-title {
      font-size: 0.95em;
      font-weight: bold;
      margin: 0 0 4px 0;
    }

    .item-title a {
      color: black;
      text-decoration: none;
    }

    .item-title a:hover {
      text-decoration: underline;
    }

    .item-desc {
      font-size: 0.85em;
      color: #333;
      margin: 0 0 6px 0;
      line-height: 1.5;
    }

    .item-meta {
      font-size: 0.8em;
      color: #666;
    }

    .item-meta a {
      color: #666;
    }

    .item-meta a:hover {
      color: black;
    }

    #status {
      font-size: 0.85em;
      color: #555;
      padding: 14px 0;
    }

    #status.error {
      color: red;
    }
  </style>
</head>
<body>
  <h1>Irons All In</h1>
  <p class="page-desc">All the West Ham news from all over the web</p>
  <p class="page-links">
    <a href="https://feedserve.adams-paul.workers.dev/ironsallin">RSS</a>
    <a href="https://pauladams.neocities.org/articles/wtf-is-an-rss-feed" target="_blank" rel="noopener noreferrer">(?)</a>
  </p>

  <ul class="item-list" id="itemList">
    <li id="status">Loading...</li>
  </ul>

  <script>
    const FEED_URL = 'https://feedserve.adams-paul.workers.dev/ironsallin?format=json';
    const MAX_ITEMS = 20;

    function formatDate(str) {
      if (!str) return '';
      const d = new Date(str);
      if (isNaN(d)) return '';
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function stripHtml(str) {
      if (!str) return '';
      return str.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    }

    async function loadFeed() {
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('itemList');

      try {
        const res = await fetch(FEED_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        const items = (data.items || []).slice(0, MAX_ITEMS);

        if (items.length === 0) {
          statusEl.textContent = 'No items found.';
          return;
        }

        listEl.innerHTML = '';

        items.forEach(it => {
          const title = it.title || 'No title';
          const link = it.link || it.url || '#';
          const desc = stripHtml(it.description || it.summary || '');
          const date = formatDate(it.pubDate || it.date_published);
          const source = it.sourceTitle || '';

          const li = document.createElement('li');
          li.className = 'item-row';

          const metaParts = [];
          if (date) metaParts.push(`<span>${date}</span>`);
          if (source) metaParts.push(`<a href="${escHtml(link)}" target="_blank" rel="noopener noreferrer">${escHtml(source)}</a>`);

          li.innerHTML = `
            <p class="item-title"><a href="${escHtml(link)}" target="_blank" rel="noopener noreferrer">${escHtml(title)}</a></p>
            ${desc ? `<p class="item-desc">${escHtml(desc)}</p>` : ''}
            ${metaParts.length ? `<p class="item-meta">${metaParts.join(' · ')}</p>` : ''}
          `;

          listEl.appendChild(li);
        });

      } catch (err) {
        statusEl.className = 'error';
        statusEl.textContent = 'Failed to load feed. ' + err.message;
      }
    }

    function escHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    loadFeed();
  </script>
</body>
</html>
